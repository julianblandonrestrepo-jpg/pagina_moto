<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Motors</title>

    <style>

        body{
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header{
            background-color: #111;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .inicio{
            text-align: center;
            padding: 50px;
        }

        .descripcion{
            max-width: 800px;
            margin: auto;
            font-size: 18px;
            line-height: 1.6;
        }

        .logo{
            font-size: 50px;
        }

    </style>

</head>
<body>

    <!-- ENCABEZADO -->
    <header>

        <!-- LOGO -->
        <div class="logo">🏍️</div>

        <!-- NOMBRE EMPRESA -->
        <h1>Speed Motors</h1>

    </header>

    <!-- SECCIÓN INICIO -->
    <section class="inicio">

        <!-- BIENVENIDA -->
        <h2>Bienvenido a Speed Motors</h2>

        <!-- DESCRIPCIÓN -->
        <p class="descripcion">
            Somos una empresa especializada en la venta de motos deportivas,
            urbanas y de alto cilindraje. Nuestro objetivo es ofrecer calidad,
            seguridad y los mejores precios para todos los amantes de las motos.
        </p>

    </section>

</body>
</html>
